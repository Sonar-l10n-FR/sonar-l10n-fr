# Throwaway SonarQube stack for checking the plugin against a real server.
#
#   docker compose -f recette/docker-compose.yml up -d
#   tools/mvn.sh -B clean verify
#   docker cp target/sonar-l10n-fr-plugin-*.jar sqfr-sonarqube:/opt/sonarqube/extensions/plugins/
#   docker compose -f recette/docker-compose.yml restart sonarqube
#   -> http://localhost:9020  (admin / admin)
#
# Port 9020 and the sqfr- prefix keep this away from any other SonarQube already
# running on the machine: nothing here shares a name, a port or a volume with them.
#
# Everything is disposable. `down -v` is the intended way to reset it.
name: sonar-l10n-fr-recette

services:
  sonarqube:
    # Pinned, not the floating `community` tag: SonarQube migrates its schema on
    # startup and cannot migrate back down, so a silent pull would be one-way.
    # This is the version the bundle is translated against -- see sonar.version
    # in pom.xml, which must stay in step with it.
    image: sonarqube:26.10.0.133078-community
    container_name: sqfr-sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '9020:9000'
    environment:
      SONAR_JDBC_URL: 'jdbc:postgresql://db:5432/sonar'
      SONAR_JDBC_USERNAME: 'sonar'
      SONAR_JDBC_PASSWORD: 'sonar'
      # Elasticsearch wants vm.max_map_count >= 262144; under Docker Desktop the
      # default is lower and the container dies at startup without this.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - data:/opt/sonarqube/data
      - extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # curl is the only HTTP client in the image -- it ships no wget.
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/api/system/status | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: sqfr-db
    environment:
      POSTGRES_USER: 'sonar'
      POSTGRES_PASSWORD: 'sonar'
      POSTGRES_DB: 'sonar'
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not a plain psql: it reports a distinct exit code while the
      # database is still initialising, which is the state not to mistake for ready.
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  data:
  extensions:
  db:
