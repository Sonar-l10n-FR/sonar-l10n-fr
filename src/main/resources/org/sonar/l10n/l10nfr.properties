property.sonar.secrets.demoMode.description=When enabled, every non-binary file is analyzed, all filters that discard fake and placeholder secrets are disabled (enables 'sonar.secrets.disableKnownFakeSecretFilter'), low-entropy secrets are reported (enables 'sonar.secrets.disableEntropyFilter'), automatically detected test files are analyzed (enables 'sonar.secrets.disableTestFileDetection'), and no file suffix is excluded from the secrets analysis (clears 'sonar.secrets.excluded.file.suffixes'). This is a shortcut for setting all the individual properties named above. Intended for demos and evaluations: it raises findings that are known to be noisy, so it should not be used for production analyses.
property.sonar.secrets.demoMode.name=Activate demo mode for secret detection
property.sonar.secrets.disableEntropyFilter.description=When enabled, low-entropy matches that would normally be filtered out are raised as low-confidence issues. This helps surface potential fake or example secrets in benchmark or evaluation projects. Other post-filters are unaffected.
property.sonar.secrets.disableEntropyFilter.name=Disable the entropy filter for secret detection
property.sonar.secrets.disableKnownFakeSecretFilter.description=When enabled, candidates matching a rule's curated fake-secret exclusion list (e.g. repeated characters, placeholder tokens, documentation example values) are raised as low-confidence issues. This helps surface potential fake or example secrets in benchmark or evaluation projects. Other post-filters are unaffected.
property.sonar.secrets.disableKnownFakeSecretFilter.name=Disable the known fake secret filter for secret detection
property.sonar.secrets.disableTestFileDetection.description=When enabled, automatically detected test files are analyzed and findings are raised as low-confidence issues. This property has no effect on files explicitly classified as tests through the "sonar.tests" property.
property.sonar.secrets.disableTestFileDetection.name=Disable automatic test-file detection for secret detection
property.sonar.secrets.excluded.file.suffixes.description=List of file suffixes that should not be analyzed with the secrets analysis.
