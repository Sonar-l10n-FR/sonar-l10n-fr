#------------------------------------------------------------------------------
#
# Keys the SonarQube web app uses that org/sonar/l10n/core.properties does not
# carry, plus keys the two define differently.
#
# core.properties is labelled "LEGACY FILE" by SonarSource and has drifted from
# the catalogue the front end actually reads. DefaultI18n indexes only what an
# ENGLISH bundle declares, so a key missing from core.properties can never be
# translated through core_fr.properties -- the whole login screen is in that
# case. It is served through this bundle instead, which the plugin owns.
#
# Both files are generated. Regenerate the English side from a server running the
# version named by sonar.version in pom.xml, with two tools:
#   tools/webapp-keys.sh http://localhost:9020
#     the catalogue the front end ships;
#   tools/settings-keys.sh http://localhost:9020 <admin token>
#     the labels of the settings definitions. Administration screens do not read
#     those from the catalogue at all: /api/settings/list_definitions supplies a
#     name and a description per setting, which the front end shows verbatim unless
#     property.<key>.name is declared here. See SettingsKeys.
#
#------------------------------------------------------------------------------

