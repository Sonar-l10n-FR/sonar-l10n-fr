dashboard.widget.header.title.sca_mttr_tooltip=Average time to resolve dependency risks in the last 30 days.<br></br><br></br>Includes dependency risks that are closed (no longer appear in a subsequent analysis) and those that are marked safe within the last 30 days.<br></br><br></br>This metric <b>excludes</b> confirmed and false positive dependency risks.<br></br><br></br><link>Learn more about metrics</link>
