cct.clean_code_attribute=Code attribute
cct.clean_code_attribute.CLEAR=Not clear
cct.clean_code_attribute.CLEAR.advice=To be clear, the code needs to be self-explanatory and transparently communicate its functionality.
cct.clean_code_attribute.CLEAR.issue.title=This is an intentionality issue, the code is not clear enough.
cct.clean_code_attribute.CLEAR.rule=Clear
cct.clean_code_attribute.CLEAR.rule.title=This is an intentionality rule, the code should be clear.
cct.clean_code_attribute.COMPLETE=Not complete
cct.clean_code_attribute.COMPLETE.advice=To be complete, the code must be functional and achieve its implied goals through comprehensive, adequate, and thorough code constructs.
cct.clean_code_attribute.COMPLETE.issue.title=This is an intentionality issue, the code is not complete enough.
cct.clean_code_attribute.COMPLETE.rule=Complete
cct.clean_code_attribute.COMPLETE.rule.title=This is an intentionality rule, the code should be complete.
cct.clean_code_attribute.CONVENTIONAL=Not conventional
cct.clean_code_attribute.CONVENTIONAL.advice=To be conventional, the code needs to perform tasks with expected instructions, and adhere to a single choice across all instances when faced with equally good options.
cct.clean_code_attribute.CONVENTIONAL.issue.title=This is a consistency issue, the code is not conventional enough.
cct.clean_code_attribute.CONVENTIONAL.rule=Conventional
cct.clean_code_attribute.CONVENTIONAL.rule.title=This is a consistency rule, the code should be conventional.
cct.clean_code_attribute.DISTINCT=Not distinct
cct.clean_code_attribute.DISTINCT.advice=To be distinct, the code needs to have procedures and data that are unique and distinctive, without unnecessary duplication.
cct.clean_code_attribute.DISTINCT.issue.title=This is an adaptability issue, the code is not distinct enough.
cct.clean_code_attribute.DISTINCT.rule.title=This is an adaptability rule, the code should be distinct.
cct.clean_code_attribute.EFFICIENT=Not efficient
cct.clean_code_attribute.EFFICIENT.advice=To be efficient, the code needs to use resources without needless waste, and prioritize economical options when available.
cct.clean_code_attribute.EFFICIENT.issue.title=This is an intentionality issue, the code is not efficient enough.
cct.clean_code_attribute.EFFICIENT.rule=Efficient
cct.clean_code_attribute.EFFICIENT.rule.title=This is an intentionality rule, the code should be efficient.
cct.clean_code_attribute.FOCUSED=Not focused
cct.clean_code_attribute.FOCUSED.advice=To be focused, the code needs to have a single, narrow, and specific scope. Each of its units should have only one concise purpose.
cct.clean_code_attribute.FOCUSED.issue.title=This is an adaptability issue, the code is not focused enough.
cct.clean_code_attribute.FOCUSED.rule=Focused
cct.clean_code_attribute.FOCUSED.rule.title=This is an adaptability rule, the code should be focused.
cct.clean_code_attribute.FORMATTED=Not formatted
cct.clean_code_attribute.FORMATTED.advice=To be formatted, the code needs to be presented in a systematic and regular way, with the same non-semantic choices used over all the codebase.
cct.clean_code_attribute.FORMATTED.issue.title=This is a consistency issue, the code is not formatted enough.
cct.clean_code_attribute.FORMATTED.rule=Formatted
cct.clean_code_attribute.FORMATTED.rule.title=This is a consistency rule, the code should be formatted.
cct.clean_code_attribute.IDENTIFIABLE=Not identifiable
cct.clean_code_attribute.IDENTIFIABLE.advice=To be identifiable, the code needs to include names and identifiers with a regular structure based on language conventions.
cct.clean_code_attribute.IDENTIFIABLE.issue.title=This is a consistency issue, the code is not identifiable enough.
cct.clean_code_attribute.IDENTIFIABLE.rule.title=This is a consistency rule, the code should be identifiable.
cct.clean_code_attribute.LAWFUL=Not lawful
cct.clean_code_attribute.LAWFUL.advice=To be lawful, the code needs to respect licensing and copyright regulation.
cct.clean_code_attribute.LAWFUL.issue.title=This is a responsibility issue, the code is not lawful enough.
cct.clean_code_attribute.LAWFUL.rule=Lawful
cct.clean_code_attribute.LAWFUL.rule.title=This is a responsibility rule, the code should be lawful.
cct.clean_code_attribute.LOGICAL=Not logical
cct.clean_code_attribute.LOGICAL.advice=To be logical, the code needs to have well-formed and sound instructions that work together, and be free of explicit errors.
cct.clean_code_attribute.LOGICAL.issue.title=This is an intentionality issue, the code is not logical enough.
cct.clean_code_attribute.LOGICAL.rule=Logical
cct.clean_code_attribute.LOGICAL.rule.title=This is an intentionality rule, the code should be logical.
cct.clean_code_attribute.MODULAR=Not modular
cct.clean_code_attribute.MODULAR.advice=To be modular, the code needs to be organized and distributed to emphasize the separation between its parts.
cct.clean_code_attribute.MODULAR.issue.title=This is an adaptability issue, the code is not modular enough.
cct.clean_code_attribute.MODULAR.rule=Modular
cct.clean_code_attribute.MODULAR.rule.title=This is an adaptability rule, the code should be modular.
cct.clean_code_attribute.RESPECTFUL=Not respectful
cct.clean_code_attribute.RESPECTFUL.advice=To be respectful, the code needs to refrain from using discriminatory and offensive language.
cct.clean_code_attribute.RESPECTFUL.issue.title=This is a responsibility issue, the code is not respectful enough.
cct.clean_code_attribute.RESPECTFUL.rule=Respectful
cct.clean_code_attribute.RESPECTFUL.rule.title=This is a responsibility rule, the code should be respectful.
cct.clean_code_attribute.TESTED=Not tested
cct.clean_code_attribute.TESTED.advice=To be tested, the code needs to have automated functional tests that provide confidence in the functionality.
cct.clean_code_attribute.TESTED.issue.title=This is an adaptability issue, the code is not tested enough.
cct.clean_code_attribute.TESTED.rule=Tested
cct.clean_code_attribute.TESTED.rule.title=This is an adaptability rule, the code should be tested.
cct.clean_code_attribute.TRUSTWORTHY=Not trustworthy
cct.clean_code_attribute.TRUSTWORTHY.advice=To be trustworthy, the code needs to abstain from revealing or hard-coding private information.
cct.clean_code_attribute.TRUSTWORTHY.issue.title=This is a responsibility issue, the code is not trustworthy enough.
cct.clean_code_attribute.TRUSTWORTHY.rule=Trustworthy
cct.clean_code_attribute.TRUSTWORTHY.rule.title=This is a responsibility rule, the code should be trustworthy.
cct.clean_code_attribute_category.ADAPTABLE=Adaptability
cct.clean_code_attribute_category.ADAPTABLE.advice=To be adaptable, the code needs to be structured to be easy to evolve and develop with confidence.
cct.clean_code_attribute_category.ADAPTABLE.title=This is an adaptability {type, select, rule {rule} other {issue}}.
cct.clean_code_attribute_category.CONSISTENT=Consistency
cct.clean_code_attribute_category.CONSISTENT.advice=To be consistent, the code needs to be written in a uniform and conventional way.
cct.clean_code_attribute_category.CONSISTENT.title=This is a consistency {type, select, rule {rule} other {issue}}.
cct.clean_code_attribute_category.INTENTIONAL=Intentionality
cct.clean_code_attribute_category.INTENTIONAL.advice=To be intentional, the code content needs to be precise and purposeful.
cct.clean_code_attribute_category.INTENTIONAL.title=This is an intentionality {type, select, rule {rule} other {issue}}.
cct.clean_code_attribute_category.RESPONSIBLE=Responsibility
cct.clean_code_attribute_category.RESPONSIBLE.advice=To be responsible, the code must take into account its ethical obligations on data and potential impact of societal norms.
cct.clean_code_attribute_category.RESPONSIBLE.title=This is a responsibility {type, select, rule {rule} other {issue}}.
