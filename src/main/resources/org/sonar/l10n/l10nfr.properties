property.sonar.security.secretSourceRedaction.enabled.description=When enabled, detected secret values are masked in source-code views and Web API responses that return source code. For findings where a safe location cannot be determined, the entire source of the affected file is masked.
property.sonar.security.secretSourceRedaction.enabled.name=Mask detected secret values in source code
property.sonar.technicalDebt.developmentCost.description=Cost to develop one line of code (LOC). Example: if the cost to develop 1 LOC has been estimated at 30 minutes, then the value of this property would be 30.
property.sonar.technicalDebt.developmentCost.name=Development cost
property.sonar.technicalDebt.ratingGrid.description=Maintainability ratings range from A (very good) to E (very bad). The rating is determined by the value of the Technical Debt Ratio, which compares the technical debt on a project to the cost it would take to rewrite the code from scratch. The default values for A through D are 0.05,0.1,0.2,0.5. Anything over 0.5 is an E. Example: assuming the development cost is 30 minutes, a project with a technical debt of 24,000 minutes for 2,500 LOC will have a technical debt ratio of 24000/(30 * 2,500) = 0.32. That yields a maintainability rating of D.
property.sonar.technicalDebt.ratingGrid.name=Maintainability rating grid
