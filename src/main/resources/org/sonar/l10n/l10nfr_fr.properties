property.sonar.security.secretSourceRedaction.enabled.description=Une fois activé, les valeurs secrètes détectées sont masquées dans les vues du code source et dans les réponses de l\u2019API web qui renvoient du code source. Pour les constats dont aucun emplacement sûr ne peut être déterminé, tout le code source du fichier concerné est masqué.
property.sonar.security.secretSourceRedaction.enabled.name=Masquer les valeurs secrètes détectées dans le code source
property.sonar.technicalDebt.developmentCost.description=Coût de développement d\u2019une ligne de code (LOC). Exemple : si le coût de développement d\u2019une ligne est estimé à 30 minutes, la valeur de cette propriété sera 30.
property.sonar.technicalDebt.developmentCost.name=Coût de développement
property.sonar.technicalDebt.ratingGrid.description=Les scores de maintenabilité vont de A (très bon) à E (très mauvais). Le score est déterminé par le ratio de dette technique, qui compare la dette technique d\u2019un projet au coût d\u2019une réécriture complète du code. Les valeurs par défaut de A à D sont 0.05,0.1,0.2,0.5. Au-delà de 0.5, le score est E. Exemple : en supposant un coût de développement de 30 minutes, un projet cumulant 24 000 minutes de dette technique pour 2 500 lignes de code aura un ratio de dette technique de 24000/(30 * 2500) = 0,32. Cela donne un score de maintenabilité D.
property.sonar.technicalDebt.ratingGrid.name=Grille du score de maintenabilité
