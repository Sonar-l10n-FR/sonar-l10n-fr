cct.clean_code_attribute=Attribut du code
cct.clean_code_attribute.CLEAR=Pas clair
cct.clean_code_attribute.CLEAR.advice=Pour être clair, le code doit se comprendre de lui-même et exposer sa fonctionnalité en toute transparence.
cct.clean_code_attribute.CLEAR.issue.title=Il s\u2019agit d\u2019un problème d\u2019intentionnalité : le code n\u2019est pas assez clair.
cct.clean_code_attribute.CLEAR.rule=Clair
cct.clean_code_attribute.CLEAR.rule.title=Il s\u2019agit d\u2019une règle d\u2019intentionnalité : le code doit être clair.
cct.clean_code_attribute.COMPLETE=Pas complet
cct.clean_code_attribute.COMPLETE.advice=Pour être complet, le code doit être fonctionnel et atteindre les objectifs qu\u2019il suppose, au moyen de constructions exhaustives, adéquates et rigoureuses.
cct.clean_code_attribute.COMPLETE.issue.title=Il s\u2019agit d\u2019un problème d\u2019intentionnalité : le code n\u2019est pas assez complet.
cct.clean_code_attribute.COMPLETE.rule=Complet
cct.clean_code_attribute.COMPLETE.rule.title=Il s\u2019agit d\u2019une règle d\u2019intentionnalité : le code doit être complet.
cct.clean_code_attribute.CONVENTIONAL=Pas conventionnel
cct.clean_code_attribute.CONVENTIONAL.advice=Pour être conventionnel, le code doit accomplir ses tâches avec les instructions attendues et, face à des options de valeur égale, retenir partout le même choix.
cct.clean_code_attribute.CONVENTIONAL.issue.title=Il s\u2019agit d\u2019un problème de cohérence : le code n\u2019est pas assez conventionnel.
cct.clean_code_attribute.CONVENTIONAL.rule=Conventionnel
cct.clean_code_attribute.CONVENTIONAL.rule.title=Il s\u2019agit d\u2019une règle de cohérence : le code doit être conventionnel.
cct.clean_code_attribute.DISTINCT=Pas distinct
cct.clean_code_attribute.DISTINCT.advice=Pour être distinct, le code doit avoir des procédures et des données uniques et singulières, sans duplication inutile.
cct.clean_code_attribute.DISTINCT.issue.title=Il s\u2019agit d\u2019un problème d\u2019adaptabilité : le code n\u2019est pas assez distinct.
cct.clean_code_attribute.DISTINCT.rule.title=Il s\u2019agit d\u2019une règle d\u2019adaptabilité : le code doit être distinct.
cct.clean_code_attribute.EFFICIENT=Pas efficace
cct.clean_code_attribute.EFFICIENT.advice=Pour être efficace, le code doit utiliser les ressources sans gaspillage inutile et privilégier les options économes lorsqu\u2019elles existent.
cct.clean_code_attribute.EFFICIENT.issue.title=Il s\u2019agit d\u2019un problème d\u2019intentionnalité : le code n\u2019est pas assez efficace.
cct.clean_code_attribute.EFFICIENT.rule=Efficace
cct.clean_code_attribute.EFFICIENT.rule.title=Il s\u2019agit d\u2019une règle d\u2019intentionnalité : le code doit être efficace.
cct.clean_code_attribute.FOCUSED=Pas ciblé
cct.clean_code_attribute.FOCUSED.advice=Pour être ciblé, le code doit avoir une portée unique, étroite et précise. Chacune de ses unités ne doit avoir qu\u2019une seule finalité, clairement délimitée.
cct.clean_code_attribute.FOCUSED.issue.title=Il s\u2019agit d\u2019un problème d\u2019adaptabilité : le code n\u2019est pas assez ciblé.
cct.clean_code_attribute.FOCUSED.rule=Ciblé
cct.clean_code_attribute.FOCUSED.rule.title=Il s\u2019agit d\u2019une règle d\u2019adaptabilité : le code doit être ciblé.
cct.clean_code_attribute.FORMATTED=Pas mis en forme
cct.clean_code_attribute.FORMATTED.advice=Pour être mis en forme, le code doit être présenté de façon systématique et régulière, avec les mêmes choix non sémantiques dans tout le code source.
cct.clean_code_attribute.FORMATTED.issue.title=Il s\u2019agit d\u2019un problème de cohérence : le code n\u2019est pas assez mis en forme.
cct.clean_code_attribute.FORMATTED.rule=Mis en forme
cct.clean_code_attribute.FORMATTED.rule.title=Il s\u2019agit d\u2019une règle de cohérence : le code doit être mis en forme.
cct.clean_code_attribute.IDENTIFIABLE=Pas identifiable
cct.clean_code_attribute.IDENTIFIABLE.advice=Pour être identifiable, le code doit comporter des noms et des identifiants à la structure régulière, fondée sur les conventions du langage.
cct.clean_code_attribute.IDENTIFIABLE.issue.title=Il s\u2019agit d\u2019un problème de cohérence : le code n\u2019est pas assez identifiable.
cct.clean_code_attribute.IDENTIFIABLE.rule.title=Il s\u2019agit d\u2019une règle de cohérence : le code doit être identifiable.
