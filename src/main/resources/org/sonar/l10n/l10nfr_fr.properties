sca.licenses.category.copyleft_maximal=Les licences copyleft maximal répondent autrement que les autres familles à la question : « quand la licence oblige-t-elle au partage ? ». Elles obligent à partager les logiciels produits et à les placer sous la même licence. Les licences Parity et Reciprocal en sont des exemples.
sca.licenses.category.copyleft_maximal.name=Copyleft maximal
sca.licenses.category.copyleft_network=Aux exigences des licences copyleft fort, les licences copyleft réseau ajoutent l\u2019obligation de partager les programmes plus vastes bâtis avec le logiciel concerné, non seulement lorsqu\u2019on en distribue des copies, mais aussi lorsqu\u2019on l\u2019exécute pour autrui via Internet ou un autre réseau. La GNU AGPL et la Server-Side Public License en sont des exemples.
sca.licenses.category.copyleft_network.name=Copyleft réseau
sca.licenses.category.copyleft_strong=Aux exigences des licences copyleft faible, les licences copyleft fort ajoutent l\u2019obligation de partager les programmes plus vastes bâtis avec le logiciel concerné lorsqu\u2019on en distribue des copies. La GNU GPL en est un exemple.
sca.licenses.category.copyleft_strong.name=Copyleft fort
sca.licenses.category.copyleft_weak=Les licences copyleft faible obligent à partager vos modifications et ajouts au logiciel concerné lorsque vous en distribuez des copies. La GNU LGPL et la Mozilla Public License en sont des exemples.
sca.licenses.category.copyleft_weak.name=Copyleft faible
sca.licenses.category.filter_by_category=Filtrer par catégorie
sca.licenses.category.permissive_amateur=Cette catégorie rassemble les licences permissives auxquelles manque un élément essentiel des licences libres permissives modernes, ou qui imposent des exigences complexes ou confuses. Beaucoup emploient une langue floue, badine ou incomplète. Elles sont donc moins prévisibles juridiquement. Les licences Artistic 1.0 et WTFPL en sont des exemples.
sca.licenses.category.permissive_amateur.name=Permissive non standard
sca.licenses.category.permissive_standard=Cette catégorie rassemble les licences permissives les plus répandues. Elles accordent de larges permissions d\u2019usage et de modification, avec des obligations minimes, principalement l\u2019attribution. Elles réunissent tous les éléments essentiels des licences libres permissives. Les licences MIT et Apache en sont des exemples.
sca.licenses.category.permissive_standard.name=Permissive standard
sca.licenses.category.policy_not_configurable=Aucune politique ne peut être définie pour cette catégorie.
sca.licenses.category.uncategorized=Beaucoup de licences détectables n\u2019entrent dans aucune catégorie standard, généralement parce qu\u2019elles portent des exigences inhabituelles : limites à l\u2019usage commercial, clauses de moralité, obligation d\u2019acquérir une licence commerciale selon divers critères, ou obligations de déclaration atypiques. Un logiciel peut aussi n\u2019être sous aucune licence, tous droits réservés. Toute licence de la catégorie « Autre » doit être examinée et configurée au cas par cas, selon ses termes et l\u2019usage prévu.
sca.licenses.category.uncategorized.name=Autre
sca.licenses.create_profile=Créer un profil
sca.licenses.default_policy.body=Voici votre profil de licences {defaultBadge}. Tout projet auquel un autre profil n\u2019est pas affecté à la main emploiera celui-ci.
sca.licenses.default_policy.no_default=Vous n\u2019avez pas défini de profil de licences par défaut. Si un profil est défini par défaut, tous vos projets l\u2019emploieront à l\u2019analyse, sauf ceux affectés à la main à un autre.
sca.licenses.default_policy.nothing_allowed=Ce profil de licences est défini par défaut, mais aucune licence ni catégorie de licences n\u2019y est autorisée. Dans cet état, l\u2019analyse indiquera que toutes les licences sont proscrites. Sans intention de configurer immédiatement les licences autorisées, mieux vaut attendre d\u2019avoir terminé avant de définir ce profil par défaut.
sca.licenses.details_page.intro=Les profils de licences servent à définir quelles licences sont autorisées ou proscrites pour les dépendances de vos projets. Si une dépendance sous licence proscrite est trouvée à l\u2019analyse, elle sera signalée comme un risque lié aux dépendances.
sca.licenses.license_override.more_info.aria_label=En savoir plus sur {name}
sca.licenses.license_override_applied=La politique par défaut pour les licences {licenseCategory} est <b>{defaultPolicy}</b>. Vous l\u2019avez redéfinie à <b>{policy}</b>.
sca.licenses.page=Profils de licences
sca.licenses.page.intro=Un profil de licences est un ensemble de politiques définissant quelles licences sont autorisées ou proscrites pour les dépendances de vos projets. Si une dépendance sous licence proscrite est trouvée à l\u2019analyse, elle sera signalée comme un risque lié aux dépendances. Pour en savoir plus, voir la documentation {docsLink}.
sca.licenses.page.no_profiles.body=Pour que les licences d\u2019un projet soient analysées, un profil de licences doit lui être affecté. Choisir à la main les projets à analyser, ou définir un profil par défaut pour tous.
sca.licenses.page.no_profiles.title=Les licences des dépendances ne seront pas analysées tant qu\u2019aucun profil de licences n\u2019est créé.
sca.licenses.policy.nothing_allowed=Ce profil de licences n\u2019autorise aucune licence ni catégorie de licences. Dans cet état, l\u2019analyse indiquera que toutes les licences sont proscrites. Sans intention de configurer immédiatement les licences autorisées, mieux vaut attendre d\u2019avoir terminé avant de définir ce profil par défaut.
