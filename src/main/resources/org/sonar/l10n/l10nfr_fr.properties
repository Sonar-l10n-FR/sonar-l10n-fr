sandboxed_issues_intro.description_1=Fini les échecs de pipeline inattendus. Le bac à sable des problèmes rend les mises à jour de plateforme sereines : les nouveaux problèmes levés par des analyseurs mis à jour y sont placés \u2014 visibles, mais exclus du calcul de la Barrière Qualité.
sandboxed_issues_intro.description_2=<b>Activez ce réglage avant votre première analyse</b> suivant la mise à jour de SonarQube, pour garder vos pipelines au vert et laisser à vos équipes le temps de trier à leur rythme.
sandboxed_issues_intro.footer_link=Comment fonctionne le bac à sable des problèmes ?
sandboxed_issues_intro.img_alt=Image montrant des problèmes en bac à sable sur la page de synthèse, sans effet sur la Barrière Qualité. Le nouveau statut « En bac à sable » apparaît aussi sur un problème de la liste.
sandboxed_issues_intro.no_thanks=Non merci
