dependencies.risk.how.malware.body=Chaque paquet malveillant est un cas particulier, mais voici quelques principes généraux. <li>Prévenir immédiatement votre équipe sécurité.</li><li>Retirer le paquet du projet en le désinstallant et en l\u2019ôtant des fichiers de dépendances.</li><li>Renouveler tous les secrets et identifiants ayant pu être exposés : clés d\u2019API, mots de passe, jetons, certificats. Le faire depuis une autre machine, sûre.</li><li>Rechercher les signes de compromission : processus inattendus, connexions réseau, fichiers modifiés. Envisager une restauration depuis une sauvegarde saine, ou une réinstallation des systèmes touchés.</li><li>Passer à une version sûre s\u2019il en existe une, ou trouver un paquet de remplacement. Consulter le dépôt du paquet et les avis de sécurité.</li><li>Analyser votre base de code à la recherche de code malveillant qui aurait pu y être injecté pendant l\u2019exécution du paquet.</li><li>Revoir vos pratiques de sécurité, notamment la façon dont les dépendances sont évaluées, et envisager des outils qui recherchent les paquets malveillants avant installation.</li>
dependencies.risk.how.no_guidance=Sonar ne propose pas encore de conseil de remédiation pour cette vulnérabilité. Il faudra déterminer à la main s\u2019il existe une version non affectée vers laquelle migrer. Consulter la section « Quel est le risque » pour connaître les versions affectées.
