regulatory_report.description1=Le <link>rapport réglementaire</link> est un fichier .zip contenant un instantané détaillé d\u2019une branche de projet. {br} Il contient :
remediation_agent.error.agent_cost_limit_reached=Limite de traitement atteinte
remediation_agent.error.agent_cost_limit_reached.context=L\u2019agent a atteint sa limite de traitement pour cette tâche. Si cela se répète, contacter l\u2019administration de l\u2019instance.
remediation_agent.error.agent_execution_failed=Arrêt inattendu de l\u2019agent
remediation_agent.error.agent_execution_failed.context=Une erreur est survenue pendant le traitement de cette tâche par l\u2019agent. Réessayer plus tard.
remediation_agent.error.agent_execution_timeout=Délai de l\u2019agent dépassé
remediation_agent.error.agent_execution_timeout.context=L\u2019agent n\u2019a pas terminé le traitement de cette tâche à temps. Réessayer plus tard.
remediation_agent.error.base_branch_retrieval_failed=Branche de base introuvable
remediation_agent.error.base_branch_retrieval_failed.context=La branche de base du dépôt n\u2019a pas pu être déterminée. Vérifier que la branche configurée pour ce projet existe dans le dépôt.
remediation_agent.error.branch_creation_failed=La branche de correction n\u2019a pas pu être créée
remediation_agent.error.branch_creation_failed.context=L\u2019agent n\u2019a pas pu créer de branche pour la correction. Vérifier que l\u2019intégration à la plateforme DevOps peut créer des branches dans ce dépôt.
remediation_agent.error.db_error=Erreur interne
remediation_agent.error.db_error.context=Une erreur interne est survenue. Réessayer plus tard.
remediation_agent.error.dispatch_failed=La tâche n\u2019a pas pu être transmise
remediation_agent.error.dispatch_failed.context=La tâche n\u2019a pas pu être mise en file d\u2019attente pour l\u2019agent. Réessayer.
remediation_agent.error.dispatch_timeout=Délai de transmission de la tâche dépassé
remediation_agent.error.dispatch_timeout.context=La préparation et la transmission de la tâche à l\u2019agent ont pris trop de temps. Réessayer plus tard.
remediation_agent.error.entity_initialization_failed=Échec de la préparation de la tâche
remediation_agent.error.entity_initialization_failed.context=Une erreur interne est survenue pendant la préparation de la tâche. Réessayer plus tard.
remediation_agent.error.fetch_issues_failed=Les problèmes n\u2019ont pas pu être récupérés
remediation_agent.error.fetch_issues_failed.context=L\u2019agent n\u2019a pas pu récupérer le détail des problèmes. Réessayer plus tard.
remediation_agent.error.git_clone_failed=Le dépôt n\u2019a pas pu être cloné
remediation_agent.error.git_clone_failed.context=L\u2019agent n\u2019a pas pu accéder au dépôt. Vérifier les permissions sur le dépôt et que la branche existe toujours.
remediation_agent.error.git_permission_denied=Permission refusée sur le dépôt
remediation_agent.error.git_permission_denied.context=L\u2019intégration à la plateforme DevOps n\u2019a pas les permissions requises sur le dépôt. Demander à une personne qui administre l\u2019instance d\u2019accorder la lecture du dépôt, la création de branches et la création de Demandes de Fusion.
remediation_agent.error.hunter_findings_unreadable=Le constat n\u2019a pas pu être lu
remediation_agent.error.hunter_findings_unreadable.context=L\u2019agent n\u2019a pas pu lire le constat du Hunter Agent qui lui a été confié. Réessayer plus tard.
remediation_agent.error.hunter_model_probe_failed=Le service d\u2019IA n\u2019a pas répondu
remediation_agent.error.hunter_model_probe_failed.context=Le modèle d\u2019IA configuré a échoué à une vérification de démarrage. Vérifier la configuration du fournisseur d\u2019IA et réessayer.
remediation_agent.error.hunter_plan_unsound=Aucune correction sûre n\u2019a été trouvée
remediation_agent.error.hunter_plan_unsound.context=L\u2019agent a examiné son propre plan et l\u2019a jugé risqué à appliquer : aucune Demande de Fusion n\u2019a été ouverte.
remediation_agent.error.llm_configuration_invalid=La configuration du service d\u2019IA n\u2019est pas valide
remediation_agent.error.llm_configuration_invalid.context=Le fournisseur ou le modèle d\u2019IA configuré n\u2019est pas pris en charge, ou n\u2019est pas valide. Demander à une personne qui administre l\u2019instance de revoir la configuration.
remediation_agent.error.llm_configuration_missing=Le service d\u2019IA n\u2019est pas configuré
remediation_agent.error.llm_configuration_missing.context=Aucun fournisseur ni modèle d\u2019IA n\u2019est configuré pour la remédiation. Demander à une personne qui administre l\u2019instance de compléter la configuration du service d\u2019IA.
remediation_agent.error.llm_model_key_invalid=Clé d\u2019API de l\u2019IA non valide ou non autorisée
remediation_agent.error.llm_model_key_invalid.context=La clé d\u2019API de l\u2019IA configurée pour cette instance n\u2019est pas valide ou n\u2019est pas autorisée. Demander à une personne qui administre l\u2019instance de mettre à jour les identifiants de l\u2019IA.
remediation_agent.error.llm_provider_unreachable=Service d\u2019IA indisponible
remediation_agent.error.llm_provider_unreachable.context=Le service d\u2019IA est indisponible. Vérifier que le fournisseur est disponible, ou voir avec l\u2019administration de l\u2019instance s\u2019il est correctement configuré.
remediation_agent.error.llm_quota_exceeded=Quota du service d\u2019IA atteint
remediation_agent.error.llm_quota_exceeded.context=Le quota du service d\u2019IA est atteint. Demander à une personne qui administre l\u2019instance de revoir les limites du compte chez le fournisseur.
remediation_agent.error.llm_rate_limit_exceeded=Limite de débit du service d\u2019IA atteinte
remediation_agent.error.llm_rate_limit_exceeded.context=La limite de débit du service d\u2019IA a été dépassée. Réessayer plus tard.
remediation_agent.error.llm_validation_failed=Les identifiants du service d\u2019IA sont indisponibles
remediation_agent.error.llm_validation_failed.context=Les identifiants configurés pour le modèle d\u2019IA manquent ou ne sont plus valides. Demander à une personne qui administre l\u2019instance de revoir la configuration.
remediation_agent.error.no_issues_after_filter=Aucun problème corrigeable trouvé
remediation_agent.error.no_issues_after_filter.context=Aucun problème n\u2019a pu être traité après filtrage. Ils sont peut-être déjà résolus, ou non pris en charge par la remédiation automatique.
remediation_agent.error.no_patches_applied=Aucune correction n\u2019a pu être produite
remediation_agent.error.no_patches_applied.context=L\u2019agent n\u2019a pas pu produire de correction valide. Le problème est peut-être trop complexe, ou relève de motifs non pris en charge.
remediation_agent.error.no_repository_url=Aucun dépôt configuré
remediation_agent.error.no_repository_url.context=Ce projet n\u2019est lié à aucun dépôt. Demander à une personne qui administre l\u2019instance de configurer la liaison du projet.
remediation_agent.error.orchestrator_internal_error=Erreur de traitement interne
remediation_agent.error.orchestrator_internal_error.context=Une erreur interne est survenue pendant le traitement de la tâche. Réessayer plus tard. Si le problème persiste, contacter le support.
remediation_agent.error.pull_request_creation_failed=La Demande de Fusion n\u2019a pas pu être créée
remediation_agent.error.pull_request_creation_failed.context=L\u2019agent a produit une correction mais n\u2019a pas pu ouvrir de Demande de Fusion. Vérifier les permissions de l\u2019intégration à la plateforme DevOps.
remediation_agent.error.quota_exceeded=Quota de traitement atteint
remediation_agent.error.quota_exceeded.context=Le quota de traitement de cette instance est atteint. Demander à une personne qui administre l\u2019instance de revoir le quota.
remediation_agent.error.repository_too_large=Dépôt trop volumineux
remediation_agent.error.repository_too_large.context=Le dépôt dépasse la taille limite configurée pour cette instance. Demander à une personne qui administre l\u2019instance de revoir la limite.
remediation_agent.error.run_creation_failed=Échec de l\u2019initialisation de la tâche
remediation_agent.error.run_creation_failed.context=Une erreur interne est survenue pendant l\u2019initialisation de la tâche. Réessayer plus tard.
remediation_agent.error.runtime_capacity_timeout=Capacité de l\u2019agent indisponible
remediation_agent.error.runtime_capacity_timeout.context=L\u2019agent n\u2019a pas pu démarrer, faute de capacité de traitement disponible. Réessayer plus tard.
remediation_agent.error.source_files_not_found=Fichiers source introuvables
remediation_agent.error.source_files_not_found.context=L\u2019agent n\u2019a pas trouvé les fichiers du problème sur la branche extraite. Vérifier que la branche principale du projet contient les fichiers source analysés, puis relancer l\u2019analyse.
remediation_agent.error.submodules_not_supported=Les sous-modules Git ne sont pas pris en charge
remediation_agent.error.submodules_not_supported.context=Ce dépôt emploie des sous-modules Git, que l\u2019agent de remédiation ne prend pas encore en charge.
remediation_agent.error.unknown=Une erreur est survenue
remediation_agent.error.unknown.context=La tâche n\u2019a pas pu aboutir. Réessayer plus tard.
