vortex_dashboard.description.paragraph1=Vortex épargne du temps d\u2019ingénierie et des jetons en fournissant du contexte à vos agents (Guider) avant l\u2019écriture du code, et en corrigeant les problèmes (Vérifier) pendant qu\u2019il s\u2019écrit.
vortex_dashboard.description.paragraph2=Ce tableau de bord détaille les économies de chaque projet à mesure que Vortex est utilisé. Consulter notre documentation pour <link>en savoir plus sur Vortex</link>.
vortex_dashboard.impact_roi.badge.estimate=Estimation
vortex_dashboard.impact_roi.badge.estimate_description=Cette valeur est calculée à partir de l\u2019activité observée de Vortex et d\u2019hypothèses prudentes sur ce qui aurait pu se passer sans lui. Ce n\u2019est pas un résultat observé directement.
vortex_dashboard.impact_roi.badge.measured=Mesuré
vortex_dashboard.impact_roi.badge.measured_description=Cette valeur repose sur une activité observée directement par Vortex, comme un problème résolu entre deux analyses ou des règles fournies à l\u2019agent.
vortex_dashboard.impact_roi.calculation_label=Calcul
vortex_dashboard.impact_roi.calculation_link=Comment est-ce calculé ?
vortex_dashboard.impact_roi.calculation_summary=Résumé du calcul
vortex_dashboard.impact_roi.engineering_time.heading=Temps d\u2019ingénierie épargné
vortex_dashboard.impact_roi.engineering_time.tooltip_description=<p>Une estimation du temps d\u2019ingénierie que Vortex a permis d\u2019éviter en repérant ou en prévenant les problèmes plus tôt.</p><p>Elle s\u2019appuie sur l\u2019effort de correction de Sonar et sur des hypothèses prudentes sur la revue et les reprises.</p>
vortex_dashboard.impact_roi.engineering_time.tooltip_title=Temps épargné estimé
vortex_dashboard.impact_roi.engineering_time.value_label=heures épargnées
vortex_dashboard.impact_roi.engineering_time_modal.guardrail_description=Nous supposons que les problèmes auraient sinon été repérés dans votre parcours habituel de Demandes de Fusion, sans causer d\u2019incident ni de brèche. L\u2019effort de revue partagé est compté une fois par activité de l\u2019agent, et non une fois par problème.
vortex_dashboard.impact_roi.engineering_time_modal.guardrail_title=Garde-fou et note de confiance
vortex_dashboard.impact_roi.engineering_time_modal.guide_contribution_description=Quand Guider fournit les règles du projet, nous estimons les reprises évitées si un problème avait sinon atteint la revue.
vortex_dashboard.impact_roi.engineering_time_modal.guide_contribution_title=Contribution de Guider (prévention estimée)
vortex_dashboard.impact_roi.engineering_time_modal.guide_formula=Problèmes prévenus estimés × probabilité que le problème atteigne sinon la revue × (effort de correction de Sonar + temps de revue)
vortex_dashboard.impact_roi.engineering_time_modal.intro=Le temps d\u2019ingénierie épargné estime les reprises que Vortex a permis d\u2019éviter avant que le code n\u2019atteigne la revue ou la CI.
vortex_dashboard.impact_roi.engineering_time_modal.methodology=Il est calculé à partir de l\u2019activité de Guider et de Vérifier, avec l\u2019effort de correction des règles de Sonar et des hypothèses prudentes. Ce n\u2019est pas une mesure du temps de chaque personne qui développe.
vortex_dashboard.impact_roi.engineering_time_modal.title=Comment le temps d\u2019ingénierie épargné est calculé
vortex_dashboard.impact_roi.engineering_time_modal.total_formula=Contribution de Guider + contribution de Vérifier
vortex_dashboard.impact_roi.engineering_time_modal.total_label=Temps épargné total estimé
vortex_dashboard.impact_roi.engineering_time_modal.verify_contribution_description=Quand Vérifier trouve un problème et qu\u2019une analyse ultérieure ne le trouve plus, nous estimons les reprises évitées en le traitant pendant le parcours de l\u2019agent.
vortex_dashboard.impact_roi.engineering_time_modal.verify_contribution_title=Contribution de Vérifier (problèmes résolus)
vortex_dashboard.impact_roi.engineering_time_modal.verify_formula=Probabilité que le problème soit sinon corrigé × effort de correction de Sonar ajusté + probabilité qu\u2019il atteigne la revue × un aller-retour de revue estimé
vortex_dashboard.impact_roi.engineering_time_modal.whats_included=Qu\u2019est-ce qui est compris ?
vortex_dashboard.impact_roi.engineering_time_modal.whats_included.items=<li><b>Effort de correction de Sonar :</b> le temps estimé de référence pour corriger chaque règle de Sonar.</li><li><b>Temps de revue :</b> une estimation prudente de la boucle de revue, de correction et de nouvelle revue évitée.</li><li><b>Ajustements prudents :</b> les probabilités et les regroupements évitent que l\u2019estimation ne traite chaque constat comme un cycle de reprise complet et distinct.</li>
vortex_dashboard.impact_roi.error=Impossible de charger cette mesure pour l\u2019instant.
vortex_dashboard.impact_roi.guide.heading=Vortex Guider
vortex_dashboard.impact_roi.guide.tooltip_description=<p>Les problèmes prévenus sont un résultat estimé de Vortex Guider dans le cycle de développement centré sur les agents (ACDC) de Sonar.</p><p>Vortex Guider donne aux agents IA le contexte, les garde-fous, les normes et les contraintes utiles pour que leur production réponde aux exigences de votre organisation, avant et pendant l\u2019écriture du code.</p><p>Sans ce contexte, les agents peuvent produire un code fonctionnellement correct, mais en décalage avec vos normes de codage, votre architecture ou votre posture de sécurité.</p>
vortex_dashboard.impact_roi.guide.tooltip_title=Problèmes prévenus (Guider)
vortex_dashboard.impact_roi.guide.value_label=problèmes prévenus
vortex_dashboard.impact_roi.title=Impact et retour sur investissement
vortex_dashboard.impact_roi.tokens.heading=Jetons épargnés
vortex_dashboard.impact_roi.tokens.tooltip_description=Une estimation des jetons que Vortex a permis d\u2019éviter en fournissant un contexte ciblé, plutôt que de laisser l\u2019agent explorer davantage la base de code.
vortex_dashboard.impact_roi.tokens.tooltip_title=Jetons épargnés estimés
vortex_dashboard.impact_roi.tokens.value_label=jetons épargnés
vortex_dashboard.impact_roi.tokens_modal.amplification_footnote=*Facteur d\u2019amplification du contexte : une information ajoutée au contexte d\u2019un agent peut être renvoyée dans des requêtes ultérieures. Le facteur d\u2019amplification estime ce coût d\u2019entrée répété, avec une valeur fixe prudente.
vortex_dashboard.impact_roi.tokens_modal.formula=max(0, (jetons d\u2019exploration estimés \u2212 jetons de réponse de Vortex) × facteur d\u2019amplification du contexte*)
vortex_dashboard.impact_roi.tokens_modal.intro=Les jetons épargnés estiment les jetons d\u2019entrée de l\u2019agent que Vortex a permis d\u2019éviter.
vortex_dashboard.impact_roi.tokens_modal.methodology=Vortex réduit l\u2019exploration inutile de la base de code et compresse les sorties de commande volumineuses avant leur ajout au contexte de l\u2019agent.
vortex_dashboard.impact_roi.tokens_modal.navigation_description=Quand Vortex répond à une question sur la structure de la base de code, nous estimons les jetons que l\u2019agent aurait sinon employés à chercher et lire du code, puis nous retranchons la taille de la réponse de Vortex.
vortex_dashboard.impact_roi.tokens_modal.navigation_title=Économies de navigation (navigation ciblée dans la base de code)
vortex_dashboard.impact_roi.tokens_modal.title=Comment les jetons épargnés sont calculés
vortex_dashboard.impact_roi.tokens_modal.total_formula=Économies de navigation
vortex_dashboard.impact_roi.tokens_modal.total_label=Jetons épargnés estimés
vortex_dashboard.impact_roi.tokens_modal.trust_note=La taille des réponses et le gain de compression en octets sont observés. Les jetons que l\u2019agent aurait sinon employés, et l\u2019effet de l\u2019amplification du contexte, sont estimés : cette mesure est donc étiquetée « Estimation ».
vortex_dashboard.impact_roi.tokens_modal.trust_note_title=Note de confiance
vortex_dashboard.impact_roi.verify.heading=Vortex Vérifier
vortex_dashboard.impact_roi.verify.tooltip_description=<p>Les problèmes résolus sont un résultat mesuré de Vortex Vérifier dans le cycle de développement centré sur les agents (ACDC) de Sonar.</p><p>Pendant que l\u2019agent écrit le code, Vortex Vérifier analyse la modification avec les règles de SonarQube et lui renvoie les constats à traiter.</p><p>Un problème compte comme résolu quand il est trouvé par une analyse et n\u2019apparaît plus après que l\u2019agent a mis à jour le code et que Vortex l\u2019a vérifié à nouveau.</p><p>Les problèmes sont ainsi traités avant que la modification n\u2019atteigne une Demande de Fusion, ce qui réduit les reprises en aval.</p>
vortex_dashboard.impact_roi.verify.tooltip_title=Problèmes résolus (Vérifier)
vortex_dashboard.impact_roi.verify.value_label=problèmes résolus
