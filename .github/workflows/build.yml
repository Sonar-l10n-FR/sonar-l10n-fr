name: Build
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      # Declared at job level so that the `if:` guard below can read it. Secrets are not
      # exposed to workflows triggered from a fork, so this is empty for outside
      # contributors -- which is exactly what the guard tests.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clones would hurt the relevancy of the analysis, and
          # maven-git-versioning-extension derives the version from git metadata.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not 17: sonar-core and sonar-testing-harness 26.10 are compiled with class
          # file major version 65. The plugin itself still targets Java 17, see pom.xml.
          java-version: 21
          # Replaces the hand-rolled actions/cache step for ~/.m2.
          cache: maven

      - name: Build
        run: mvn -B clean verify

      - name: Analyze on SonarQube Cloud
        # Without this guard every pull request opened from a fork fails: the analysis
        # cannot authenticate, and the build is reported red for a reason that has nothing
        # to do with the contribution. The build step above still gates the PR.
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          # Needed to get PR information, if any
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.projectKey=Sonar-l10n-FR_sonar-l10n-fr
