<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="French Pack for SonarQube">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#0B1220" stroke="#24304A" stroke-width="2"/>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#glow)"/>
  <!-- A speech bubble: the pack gives the interface its words. -->
